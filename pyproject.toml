[project]
name = "reproof"
version = "0.0.1"
description = "Agentic security research pipeline: reproduction + proof, or it didn't happen"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ai-agent = ["jsonschema>=4.23,<5"]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "jsonschema>=4.23,<5",
]

[project.scripts]
reproof = "reproof.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reproof*"]

[tool.setuptools.package-data]
"reproof.ai_agent" = ["schemas/*.json"]
